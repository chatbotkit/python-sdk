[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbotkit"
version = "0.6.0"
description = "Async Python SDK for ChatBotKit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CBK.AI", email = "support@cbk.ai" }]
keywords = ["chatbotkit", "ai", "chatbot", "agent", "llm", "conversational-ai"]
urls = { Homepage = "https://cbk.ai", Documentation = "https://docs.cbk.ai/python-sdk", Source = "https://github.com/chatbotkit" }
dependencies = [
  "httpx>=0.27",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
agent = [
  "pydantic>=2.7",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
]
examples = [
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["chatbotkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
